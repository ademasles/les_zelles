[project]
name = "analyse-dce-backend"
version = "0.1.0"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "httpx",
    "ruff",
    "mypy",
    "pre-commit",
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --color=yes"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = false
# TODO: workspace currently does not contain top-level `app/` package.
# Running `mypy app` may report "Cannot find module 'app'" until package
# added or mypy invocation adjusted. Keep checks pragmatic for now.
