[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "analyse-dce-backend"
version = "0.1.0"
description = "Backend API for Analyse-DCE tender and CCTP document analysis"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "pydantic",
    "pydantic-settings",
    "pymupdf",
    "python-docx",
    "pytesseract",
    "Pillow",
    "faiss-cpu",
    "numpy",
    "torch",
    "sentence-transformers",
    "sqlalchemy",
    "aiosqlite",
    "greenlet",
    "requests",
    "protobuf",
    "docling",
]

[project.optional-dependencies]
dev = [
    "alembic",
    "pytest",
    "pytest-cov",
    "httpx",
    "ruff",
    "mypy",
    "pre-commit",
]
docx2pdf = [
    "docx2pdf",
]

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
markers = [
    "llm: marks tests that require a live Ollama instance (skipped by default)",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = false
