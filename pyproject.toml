[project]
name = "les-zelles"
version = "0.2.0"
description = "Open-source AI analysis of French construction tender specs (CCTP) for PVC, aluminium and wood joinery: cited, verified spec sheets with local or cloud LLMs."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Anton Demasles" }]
requires-python = ">=3.12"
keywords = ["cctp", "tender", "joinery", "construction", "llm", "rag", "document-ai", "ollama"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Natural Language :: French",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing",
    "Typing :: Typed",
]
dependencies = [
    "alembic>=1.14",
    "fastapi>=0.115",
    "httpx>=0.28",
    "numpy>=2.0",
    "openpyxl>=3.1",
    "pillow>=11.0",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "pypdfium2>=4.30",
    "rich>=13.9",
    "python-docx>=1.1",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0.36",
    "sse-starlette>=2.2",
    "typer>=0.15",
    "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
anthropic = ["anthropic>=2.0"]
mcp = ["mcp>=2.0"]
ocr = ["pytesseract>=0.3.13"]
docling = ["docling>=2.15"]
all = ["les-zelles[anthropic,mcp,ocr]"]

[project.scripts]
zelles = "zelles.cli:app"

[project.urls]
Repository = "https://github.com/ademasles/les_zelles"
Issues = "https://github.com/ademasles/les_zelles/issues"

[dependency-groups]
dev = [
    "fpdf2>=2.8",
    "mypy>=1.14",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "respx>=0.22",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zelles"]

# --------------------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "N", "S", "C4", "SIM", "RUF", "PTH", "PL", "TRY", "ASYNC", "FAST",
]
ignore = [
    "E501",     # line length is owned by the formatter; long literals are fine
    "PLR0911",  # parsers and validators return early by design
    "PLR0912",
    "PLR0913",  # many arguments is fine for pipeline constructors
    "PLR2004",  # magic values are domain constants (Uw, dB...)
    "TRY003",   # long messages in exceptions are fine
    "S101",     # assert is used in tests
    "RUF001",   # French text contains typographic characters on purpose
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR", "PLC0415", "N802"]
"src/zelles/api/app.py" = ["PLR0915"]  # routes are declared inside the app factory
"src/zelles/storage/migrations/**" = ["N999", "E501"]

# --------------------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["zelles"]
exclude = ["src/zelles/storage/migrations/"]

[[tool.mypy.overrides]]
module = ["pypdfium2.*", "docx.*", "pytesseract.*", "docling.*", "openpyxl.*", "sse_starlette.*", "mcp.*", "anthropic.*"]
ignore_missing_imports = true

# --------------------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = ["live: needs a running model server (skipped by default)"]

[tool.coverage.run]
source = ["zelles"]
branch = true
omit = ["src/zelles/storage/migrations/*"]
